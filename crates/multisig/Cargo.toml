[package]
name = "warpdrive-multisig-account"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek.workspace = true
sha2.workspace = true
# Used by the host-backed test to drive the real `sign_auth_entry` helper
# through `__check_auth`. A dev-only, reverse dependency (the library never
# depends on this fixture), so it does not affect publishing wasi-soroban-rs.
wasi-soroban-rs.workspace = true
